name: 构建 A3 内核与镜像

# 两种触发方式：
#   1. 手动：在 Actions 页面点 "Run workflow"，可勾选要构建哪些产物
#   2. 自动：push 修改 patch/ 或本 workflow 时
on:
  workflow_dispatch:
    inputs:
      build_boot:
        description: '构建 boot.img（内核 + 设备树）'
        type: boolean
        default: true
      build_rootfs_minimal:
        description: '构建 rootfs-minimal（最小系统 + SSH）'
        type: boolean
        default: true
      build_rootfs_desktop:
        description: '构建 rootfs-desktop（phosh 桌面）'
        type: boolean
        default: true
      build_rootfs_fnos:
        description: '构建 rootfs-fnos（飞牛 FnNAS）'
        type: boolean
        default: true
      auto_ecm:
        description: '三个 rootfs 注入 RNDIS→ECM 自动切换（放 NAS 用；Windows 调试勿选）'
        type: boolean
        default: true
  push:
    paths:
      - 'patch/**'
      - 'script/**'
      - 'vendor/**'
      - 'fnnas/**'
      - '.github/workflows/**'

# 同一分支只保留最新一次运行：新提交会取消还在跑的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 应用补丁、编译内核、打包镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: 取出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 补丁与仓库内容一览
        run: |
          echo "补丁："; ls -1 patch/
          echo; echo "厂商文件："; ls -lh vendor/ 2>/dev/null || echo "(vendor 目录为空)"
          echo; echo "脚本："; ls -1 script/

      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross bc bison flex libssl-dev libelf-dev \
            make xz-utils ca-certificates zip p7zip-full \
            debootstrap qemu-user-static binfmt-support \
            e2fsprogs python3 zstd \
            android-sdk-libsparse-utils

      - name: 显示 qemu/binfmt 状态
        run: |
          ls -l /usr/bin/qemu-aarch64-static 2>/dev/null || echo "缺少 qemu-aarch64-static"
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | head -5 || true

      - name: 下载干净的 Linux 6.12.115
        run: |
          set -e
          curl -fsSL -o linux.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.115.tar.xz
          tar xf linux.tar.xz
          test -d linux-6.12.115

      - name: 应用全部补丁
        run: |
          set -e
          cd linux-6.12.115
          n=0
          for p in ../patch/*.patch; do
            echo "===== $p ====="
            patch -p1 --no-backup-if-mismatch < "$p"
            n=$((n + 1))
          done
          echo "共应用 $n 个补丁"

      - name: 编译内核
        run: |
          set -e
          cd linux-6.12.115
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- a3_defconfig
          # fnOS 资源管理(resmon)的 proc.list 读 /proc/<pid>/io，
          # a3_defconfig 默认关闭 TASKSTATS 导致该文件不存在 → errno 4096。
          # 用内核自带 scripts/config 打开 per-task I/O 统计依赖链。
          scripts/config --enable TASKSTATS
          scripts/config --enable TASK_DELAY_ACCT
          scripts/config --enable TASK_XACCT
          scripts/config --enable TASK_IO_ACCOUNTING
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E 'CONFIG_TASK(STATS|XACCT|DELAY_ACCT|IO_ACCOUNTING)' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image
          # 为 trim_acl_shim.ko 生成 Module.symvers（Image target 不产出）
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modules
          ls -lh arch/arm64/boot/Image System.map Module.symvers

      - name: 打包 boot.img
        if: github.event_name != 'workflow_dispatch' || inputs.build_boot
        run: |
          set -e
          chmod +x script/*.sh
          export A3_ROOT="$PWD"
          export A3_OUT="$PWD/linux-6.12.115"
          export A3_IMG="$PWD/vendor"
          export A3_SCRIPTS="$PWD/script"
          mkdir -p out
          # 触摸可用版本用 a3-v186-tgpio.dtb
          if [ -f vendor/a3-v186-tgpio.dtb ]; then
            export A3_DTB="$PWD/vendor/a3-v186-tgpio.dtb"
          fi
          bash script/a3-mkboot.sh boot
          test -f "$PWD/vendor/boot.img" || { echo "打包产物缺失"; ls -l vendor/; exit 1; }
          cp -v "$PWD/vendor/boot.img" out/boot.img
          ls -lh out/boot.img
          md5sum out/boot.img

      - name: 编译 trim_acl_shim.ko 并打包安装器
        run: |
          set -e
          # CI 是 in-tree 构建：源码目录即构建目录，不能传 O= 参数，
          # 否则内核 Makefile 会把 out/in-tree 混淆、去找工作区根 Makefile 而失败。
          # 直接调用内核 Makefile 编外部模块（M=fnnas/kmod）。
          KDIR="$PWD/linux-6.12.115"
          M="$PWD/fnnas/kmod"
          make -C "$KDIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M="$M" clean 2>/dev/null || true
          make -C "$KDIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M="$M" modules
          modinfo "$M/trim_acl_shim.ko" | grep vermagic
          mkdir -p release release-pkg/trim-acl-shim
          cp -v fnnas/kmod/trim_acl_shim.ko release-pkg/trim-acl-shim/
          cp -v fnnas/kmod/install-trim-acl.sh release-pkg/trim-acl-shim/ 2>/dev/null || \
            echo "警告: install-trim-acl.sh 未找到"
          chmod +x release-pkg/trim-acl-shim/install-trim-acl.sh 2>/dev/null || true
          ( cd release-pkg && zip -qr ../release/trim-acl-shim.zip trim-acl-shim )
          ls -lh release/trim-acl-shim.zip

      - name: 上传 trim-acl-shim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trim-acl-shim
          path: release/trim-acl-shim.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 构建 rootfs-minimal.img
        if: github.event_name != 'workflow_dispatch' || inputs.build_rootfs_minimal
        run: |
          set -e
          chmod +x script/*.sh
          sudo mkdir -p /work && sudo chown "$USER" /work
          A3_USBNET_AUTO_ECM="${{ github.event_name == 'workflow_dispatch' && inputs.auto_ecm && '1' || '0' }}" \
          sudo -E script/build-rootfs.sh minimal out/rootfs-minimal.img 1G

      - name: 构建 rootfs-desktop.img（phosh）
        if: github.event_name != 'workflow_dispatch' || inputs.build_rootfs_desktop
        run: |
          set -e
          chmod +x script/*.sh
          sudo mkdir -p /work && sudo chown "$USER" /work
          A3_USBNET_AUTO_ECM="${{ github.event_name == 'workflow_dispatch' && inputs.auto_ecm && '1' || '0' }}" \
          sudo -E script/build-rootfs.sh phosh out/rootfs-desktop.img 3G

      - name: 构建 rootfs-fnos.img（飞牛 FnNAS）
        if: github.event_name != 'workflow_dispatch' || inputs.build_rootfs_fnos
        run: |
          set -e
          chmod +x script/*.sh fnnas/*.sh
          # 素材（trimfs.tgz / trim-media-lib.zip）由脚本从 GitHub source release 自动下载
          WORK="$PWD/wv/fnnas-build" OUT="$PWD/out" \
          TRIM_ACL_KO="$PWD/fnnas/kmod/trim_acl_shim.ko" \
          A3_USBNET_AUTO_ECM="${{ github.event_name == 'workflow_dispatch' && inputs.auto_ecm && '1' || '0' }}" \
            bash fnnas/build-rootfs-fnnas.sh "" "" 8
          ls -lh out/fnnas-rootfs.img out/fnnas-rootfs.simg

      # ---- 把 rootfs 转成 fastboot 可写的 simg，并单独 zip 压缩 ----
      - name: 生成 simg 并压缩 rootfs
        if: always()
        run: |
          set -e
          mkdir -p release
          # boot 不压缩，直接放（供独立上传）
          [ -f out/boot.img ] && cp -v out/boot.img release/boot.img || true
          # 其余三个 rootfs：img -> simg -> zip
          for pair in \
            "rootfs-minimal:rootfs-minimal" \
            "rootfs-desktop:rootfs-desktop" \
            "fnnas-rootfs:rootfs-fnos"; do
            src="${pair%%:*}"; dst="${pair##*:}"
            img="out/${src}.img"
            [ -f "$img" ] || { echo "跳过 $img（未构建）"; continue; }
            simg="out/${src}.simg"
            if [ ! -f "$simg" ]; then
              echo "生成 $simg"
              img2simg "$img" "$simg"
            fi
            ls -lh "$simg"
            ( cd out && zip -q "../release/${dst}.simg.zip" "${src}.simg" )
            ls -lh "release/${dst}.simg.zip"
          done
          echo "=== release 目录 ==="
          ls -lh release/

      # ---- 四个独立 artifact ----
      - name: 上传 boot.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot
          path: release/boot.img
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 rootfs-minimal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-minimal
          path: release/rootfs-minimal.simg.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 rootfs-desktop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-desktop
          path: release/rootfs-desktop.simg.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 rootfs-fnos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-fnos
          path: release/rootfs-fnos.simg.zip
          if-no-files-found: warn
          retention-days: 14
