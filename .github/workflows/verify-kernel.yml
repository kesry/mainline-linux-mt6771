name: 验证内核补丁集

# 手动触发：验证 patch/ 里的补丁能应用到干净的 Linux 6.12.115 并编译出 Image
on:
  workflow_dispatch:
  push:
    paths:
      - 'patch/**'
      - '.github/workflows/**'

jobs:
  build:
    name: 应用补丁并编译 Image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 取出本仓库
        uses: actions/checkout@v4

      - name: 显示补丁清单
        run: |
          echo "本仓库补丁："
          ls -1 patch/
          echo
          echo "补丁总行数："
          wc -l patch/*.patch | tail -1

      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev \
            make xz-utils ca-certificates

      - name: 下载干净的 Linux 6.12.115
        run: |
          set -e
          curl -fsSL -o linux.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.115.tar.xz
          tar xf linux.tar.xz
          test -d linux-6.12.115
          echo "源码树就绪"

      - name: 应用全部补丁
        run: |
          set -e
          cd linux-6.12.115
          n=0
          for p in ../patch/*.patch; do
            echo "===== 应用 $p ====="
            patch -p1 --no-backup-if-mismatch < "$p"
            n=$((n + 1))
          done
          echo "共应用 $n 个补丁"

      - name: 编译内核
        run: |
          set -e
          cd linux-6.12.115
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- a3_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image
          ls -lh arch/arm64/boot/Image

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Image-6.12.115-a3
          path: linux-6.12.115/arch/arm64/boot/Image
          if-no-files-found: error
